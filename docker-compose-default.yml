version: "3"
services:
  gaia_val1:
    image: gaia-amulet-0.0.1
    command:
      - start
      - --home=/opt
      - --log_level=debug
      - --pruning=nothing
      - --log_format=info
      - --trace
    entrypoint:
      - gaiad
    volumes:
      - gaia_val1:/opt
    ports:
      - 127.0.0.1:26657:26657
      - 127.0.0.1:1317:1317
      - 127.0.0.1:9090:9090
  gaia_val2:
    image: gaia-amulet-0.0.1
    command:
      - start
      - --home=/opt
      - --log_level=debug
      - --pruning=nothing
      - --log_format=info
      - --trace
    entrypoint:
      - gaiad
    volumes:
      - gaia_val2:/opt
  gaia_val3:
